<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Commercial Video Editor</title>
  <desc id="desc">Abstract gig cover image for commercial video editing work.</desc>

  <defs>
